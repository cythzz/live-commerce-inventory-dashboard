services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: live_analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d live_analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://analytics:analytics@postgres:5432/live_analytics
      UPLOAD_DIR: /app/uploads
      REPORT_DIR: /app/reports
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - report-data:/app/reports
      - upload-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    volumes:
      - report-data:/app/reports
    depends_on:
      - api

volumes:
  postgres-data:
  report-data:
  upload-data:
